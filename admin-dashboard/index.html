<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart OPD Dashboard - patient tokens, doctor and staff queues, live monitoring, forecasts and model management" />
    <meta name="color-scheme" content="dark light" />
    <title>Smart OPD Dashboard</title>
    <script id="theme-boot">
      // Apply the saved theme before the first paint (Decision 5): "light" only when stored,
      // otherwise dark. The OS colour scheme is not followed. Storage may be blocked.
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('smartopd.theme') === 'light') t = 'light';
        } catch (e) { /* storage blocked: dark */ }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
